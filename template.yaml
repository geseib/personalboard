AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Personal Board - A tool for managing your personal board of directors

Parameters:
  DomainName:
    Type: String
    Default: board.seibtribe.us
    Description: The domain name for the website
  
  HostedZoneId:
    Type: String
    Description: The Route 53 hosted zone ID for the domain
    
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - production
      - pbod
      - dev
      - test
    Description: The deployment environment

  StackName:
    Type: String
    Default: personal-board
    Description: The name of the stack

  GitHubToken:
    Type: String
    NoEcho: true
    Description: GitHub Personal Access Token for creating issues

  GeminiApiKeyParameter:
    Type: String
    Default: ''
    Description: Optional SSM SecureString parameter name containing the Gemini API key
    AllowedPattern: '^$|/[a-zA-Z0-9_.\-/]+$'

  AdminPassword:
    Type: String
    NoEcho: true
    Description: Password for admin interface access
    MinLength: 8
    MaxLength: 50

Conditions:
  HasGeminiApiKey: !Not [!Equals [!Ref GeminiApiKeyParameter, '']]

Resources:
  # DynamoDB Table for Access Codes
  AccessCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackName}-access-codes'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: PersonalBoard
        - Key: Environment
          Value: !Ref Environment

  # DynamoDB Table for Prompt Management
  PromptManagementTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${StackName}-prompt-management'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: PersonalBoard
        - Key: Environment
          Value: !Ref Environment

  # API Gateway for AI endpoints
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${StackName}-api'
      Description: API for Personal Board AI guidance
      EndpointConfiguration:
        Types:
          - EDGE
      BinaryMediaTypes:
        - '*/*'
      Tags:
        - Key: Project
          Value: PersonalBoard
        - Key: Environment
          Value: !Ref Environment

  # Lambda Authorizer for API Gateway
  LambdaAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${StackName}-jwt-authorizer'
      Type: REQUEST
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations'
      AuthorizerCredentials: !GetAtt AuthorizerRole.Arn
      AuthorizerResultTtlInSeconds: 300
      IdentitySource: method.request.header.Authorization
      RestApiId: !Ref RestApi

  # IAM Role for Lambda Authorizer
  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AuthorizerFunction.Arn

  # API Gateway Deployment
  ApiDeploymentAIModels20261001:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - AdminAISettingsGetMethod
      - AdminAISettingsPutMethod
      - AdminAISettingsOptionsMethod
      - AdminAIComparePostMethod
      - AdminAICompareOptionsMethod
      - AdminAIHistoryGetMethod
      - AdminAIHistoryOptionsMethod
      - AdminAIRollbackPostMethod
      - AdminAIRollbackOptionsMethod
      - AIGuidanceMethod
      - AIGuidanceOptionsMethod
      - FeedbackMethod
      - FeedbackOptionsMethod
      - ActivateMethod
      - ActivateOptionsMethod
      - AdminPromptsGetMethod
      - AdminPromptsPostMethod
      - AdminPromptsOptionsMethod
      - AdminSeedMethod
      - AdminPromptActivateMethod
      - AdminPromptDeleteMethod
      - AdminPromptUpdateMethod
      - AdminPromptActivateOptionsMethod
      - AdminPromptIdOptionsMethod
      - AdminThemesGetMethod
      - AdminThemesOptionsMethod
      - AdminThemeActivateMethod
      - AdminThemeActivateOptionsMethod
      - AdminThemeAdvancedSaveMethod
      - AdminThemeAdvancedSaveOptionsMethod
      - AdminThemeDeleteMethod
      - AdminThemeDeleteOptionsMethod
      - AdminTokensNextGetMethod
      - AdminTokensNextOptionsMethod
      - AdminTokensStatsGetMethod
      - AdminTokensStatsOptionsMethod
      - AdminTokensGeneratePostMethod
      - AdminTokensGenerateOptionsMethod
    # Rename this logical ID whenever routes change so API Gateway publishes them. StageName points the
    # existing stage at the new deployment. Do not add StageDescription: it is only accepted when the
    # stage does not exist yet, so a renamed deployment fails with "stage ... already exists".
    Properties:
      RestApiId: !Ref RestApi
      StageName: !Ref Environment
      Description: !Sub 'Personal Board API - ${Environment}'

  # AI Guidance Lambda Function
  AIGuidanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-ai-guidance'
      CodeUri: lambda-functions/ai-guidance/
      Handler: ai-guidance.handler
      Runtime: nodejs22.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          NODE_ENV: !Ref Environment
          PROMPT_MANAGEMENT_TABLE: !Ref PromptManagementTable
          GEMINI_API_KEY_PARAMETER: !Ref GeminiApiKeyParameter
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-micro-v1:0'
                - 'arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0'
                - 'arn:aws:bedrock:us-east-2::foundation-model/amazon.nova-micro-v1:0'
                - 'arn:aws:bedrock:us-west-2::foundation-model/amazon.nova-micro-v1:0'
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0'
                - 'arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-lite-v1:0'
                - 'arn:aws:bedrock:us-east-2::foundation-model/amazon.nova-lite-v1:0'
                - 'arn:aws:bedrock:us-west-2::foundation-model/amazon.nova-lite-v1:0'
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0'
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6'
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0'
                - 'arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-2-lite-v1:0'
                - 'arn:aws:bedrock:us-east-2::foundation-model/amazon.nova-2-lite-v1:0'
                - 'arn:aws:bedrock:us-west-2::foundation-model/amazon.nova-2-lite-v1:0'
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/qwen.qwen3-next-80b-a3b'
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/openai.gpt-oss-120b-1:0'
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-5-5'
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-5-5'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-5-5'
                - 'arn:aws:bedrock:us-west-1::foundation-model/anthropic.claude-sonnet-5-5'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-5-5'
                - 'arn:aws:bedrock:ca-central-1::foundation-model/anthropic.claude-sonnet-5-5'
                - 'arn:aws:bedrock:ca-west-1::foundation-model/anthropic.claude-sonnet-5-5'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt PromptManagementTable.Arn
        - !If
          - HasGeminiApiKey
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiApiKeyParameter}'
          - !Ref AWS::NoValue
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  # Admin Data Management Lambda Function
  AdminDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-data'
      CodeUri: lambda-functions/admin-data/
      Handler: admin-data.handler
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          NODE_ENV: !Ref Environment
          PROMPT_MANAGEMENT_TABLE: !Ref PromptManagementTable
          AI_GUIDANCE_FUNCTION: !Ref AIGuidanceFunction
          ADMIN_PASSWORD: !Ref AdminPassword
          ACCESS_CODES_TABLE: !Ref AccessCodesTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchGetItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt PromptManagementTable.Arn
                - !GetAtt AccessCodesTable.Arn
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt AIGuidanceFunction.Arn
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  # Feedback Lambda Function
  FeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-feedback'
      CodeUri: lambda-functions/feedback/
      Handler: feedback.handler
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          NODE_ENV: !Ref Environment
          GITHUB_TOKEN: !Ref GitHubToken
          GITHUB_REPO: 'geseib/personalboard'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  # Authentication Lambda Functions
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-jwt-authorizer'
      CodeUri: lambda-functions/auth/
      Handler: authorizer.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/personal-board/jwt-secret'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ActivateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-activate'
      CodeUri: lambda-functions/auth/
      Handler: activate.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref AccessCodesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccessCodesTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/personal-board/jwt-secret'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  GenerateCodesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-generate-codes'
      CodeUri: lambda-functions/auth/
      Handler: generate-codes.handler
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref AccessCodesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccessCodesTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  # Lambda permissions for API Gateway
  AIGuidanceLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AIGuidanceFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*'

  FeedbackLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FeedbackFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*'

  ActivateLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ActivateFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*'

  # API Gateway Resources and Methods
  AIGuidanceResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'ai-guidance'

  FeedbackResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'feedback'

  ActivateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'activate'

  AIGuidanceMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AIGuidanceResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AIGuidanceFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # CORS Options Method - Route to Lambda
  AIGuidanceOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AIGuidanceResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AIGuidanceFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  FeedbackMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref FeedbackResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FeedbackFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  FeedbackOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref FeedbackResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FeedbackFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  ActivateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ActivateResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ActivateFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  ActivateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ActivateResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ActivateFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  AdminAIResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminResource
      PathPart: ai

  AdminAISettingsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminAIResource
      PathPart: settings

  AdminAISettingsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AdminAISettingsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDataFunction.Arn}/invocations'

  AdminAISettingsPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AdminAISettingsResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDataFunction.Arn}/invocations'

  AdminAISettingsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AdminAISettingsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDataFunction.Arn}/invocations'

  AdminAICompareResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminAIResource
      PathPart: compare

  AdminAIComparePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AdminAICompareResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDataFunction.Arn}/invocations'

  AdminAICompareOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AdminAICompareResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDataFunction.Arn}/invocations'

  AdminAIHistoryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminAIResource
      PathPart: history

  AdminAIHistoryGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AdminAIHistoryResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDataFunction.Arn}/invocations'

  AdminAIHistoryOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AdminAIHistoryResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDataFunction.Arn}/invocations'

  AdminAIRollbackResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminAIResource
      PathPart: rollback

  AdminAIRollbackPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AdminAIRollbackResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDataFunction.Arn}/invocations'

  AdminAIRollbackOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref AdminAIRollbackResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDataFunction.Arn}/invocations'

  # Admin API Resources
  AdminResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'admin'

  AdminPromptsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminResource
      PathPart: 'prompts'

  AdminSeedResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminResource
      PathPart: 'seed'

  AdminPromptIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminPromptsResource
      PathPart: '{promptId}'

  AdminPromptActivateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminPromptIdResource
      PathPart: 'activate'

  # Theme Management Resources
  AdminThemesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminResource
      PathPart: 'themes'

  AdminThemeIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminThemesResource
      PathPart: '{themeId}'

  AdminThemeActivateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref AdminThemeIdResource
